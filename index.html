<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sand Clock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    /* ── FULL VIEW ── */
    .widget {
      width: 100vw;
      height: 100vh;
      background: transparent;
      border-radius: 18px;
      border: 1.5px solid rgba(74,156,196,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5vw 2vw 2vw;
      gap: 0;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .close-btn {
      position: absolute;
      top: clamp(6px, 1.5vw, 12px);
      right: clamp(22px, 6vw, 32px);
      width: clamp(10px, 2.5vw, 14px);
      height: clamp(10px, 2.5vw, 14px);
      border-radius: 50%;
      background: #ff5f56;
      border: none;
      cursor: pointer;
      z-index: 10;
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { background: #ff2d20; }

    .mini-btn {
      position: absolute;
      top: clamp(6px, 1.5vw, 12px);
      right: clamp(6px, 1.5vw, 12px);
      width: clamp(10px, 2.5vw, 14px);
      height: clamp(10px, 2.5vw, 14px);
      border-radius: 50%;
      background: #ffbd2e;
      border: none;
      cursor: pointer;
      z-index: 10;
      -webkit-app-region: no-drag;
    }
    .mini-btn:hover { background: #ffaa00; }

    .hg-wrap {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      -webkit-app-region: no-drag;
    }
    .hg-wrap svg {
      width: 100%;
      height: 100%;
      max-width: 200px;
      max-height: 100%;
      display: block;
    }
    .hg-wrap:active { transform: scale(0.97); }

    .flip-hint {
      font-size: clamp(8px, 1.8vw, 11px);
      color: #4a9cc4;
      margin-top: 2px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .time-display {
      font-size: clamp(18px, 5vw, 32px);
      font-weight: 300;
      color: #1a5f8a;
      letter-spacing: 2px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      line-height: 1.1;
    }

    .status {
      font-size: clamp(9px, 2vw, 13px);
      color: #4a9cc4;
      letter-spacing: 0.3px;
      min-height: 1.4em;
      flex-shrink: 0;
      margin: 2px 0 3px;
    }

    .done-banner {
      font-size: clamp(9px, 1.9vw, 12px);
      color: #1a6a40;
      background: rgba(46,125,79,0.10);
      border: 1px solid rgba(46,125,79,0.25);
      border-radius: 8px;
      padding: 3px 10px;
      display: none;
      text-align: center;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      gap: clamp(4px, 1.5vw, 10px);
      margin-top: 4px;
      flex-shrink: 0;
      width: 100%;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    button.ctrl {
      border: 1px solid rgba(42,96,150,0.4);
      background: rgba(42,96,150,0.08);
      color: #1a5f8a;
      border-radius: 8px;
      padding: clamp(4px, 1vw, 7px) clamp(10px, 3vw, 18px);
      font-size: clamp(9px, 2vw, 13px);
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      flex: 1;
      max-width: 80px;
    }
    button.ctrl:hover { background: rgba(42,96,150,0.16); }
    button.ctrl.primary {
      background: rgba(42,96,150,0.16);
      color: #1a4a72;
      font-weight: 500;
    }
    button.ctrl.primary:hover { background: rgba(42,96,150,0.28); }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(42,96,150,0.15);
      margin: clamp(4px, 1.2vw, 8px) 0;
      flex-shrink: 0;
    }

    .stats-section { width: 100%; flex-shrink: 0; }

    .stats-label {
      font-size: clamp(7px, 1.6vw, 10px);
      color: #4a9cc4;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: clamp(3px, 1vw, 7px);
      text-align: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(4px, 1.2vw, 8px);
    }

    .stat-card {
      background: rgba(42,96,150,0.07);
      border: 1px solid rgba(42,96,150,0.20);
      border-radius: 10px;
      padding: clamp(4px, 1.2vw, 8px) clamp(4px, 1.5vw, 12px);
      text-align: center;
    }

    .stat-val {
      font-size: clamp(14px, 4vw, 22px);
      font-weight: 400;
      color: #1a5f8a;
      line-height: 1.1;
    }

    .stat-lbl {
      font-size: clamp(7px, 1.6vw, 10px);
      color: #4a9cc4;
      margin-top: 2px;
    }

    @keyframes shake {
      0%,100% { transform: rotate(0deg); }
      20%      { transform: rotate(-10deg); }
      40%      { transform: rotate(10deg); }
      60%      { transform: rotate(-6deg); }
      80%      { transform: rotate(6deg); }
    }
    .flipping { animation: shake 0.45s ease; }

    @keyframes drip { 0%,100%{opacity:0.5} 50%{opacity:1} }
    #stream { animation: drip 0.8s ease-in-out infinite; display: none; }

    /* ── MINI VIEW ── */
    .mini-view {
      display: none;
      width: 100vw;
      height: 100vh;
      border-radius: 14px;
      border: 1.5px solid rgba(74,156,196,0.55);
      background: transparent;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      -webkit-app-region: drag;
    }
    .mini-view svg { width: 28px; height: auto; display: block; }
    .mini-time-lbl {
      font-size: 11px;
      font-weight: 400;
      color: #1a5f8a;
      letter-spacing: 1px;
    }
    .mini-run-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ffbd2e;
      position: absolute;
      top: 6px; right: 6px;
      display: none;
    }

    body.is-mini .widget   { display: none; }
    body.is-mini .mini-view { display: flex; }
  </style>
</head>
<body>

<!-- FULL WIDGET -->
<div class="widget">
  <button class="close-btn" onclick="closeApp()" title="Close"></button>
  <button class="mini-btn"  onclick="toggleMini()" title="Mini mode"></button>

  <div class="hg-wrap" id="hgWrap" onclick="flipClock()">
    <svg viewBox="0 0 140 220" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="topClip"><polygon points="16,18 124,18 70,110"/></clipPath>
        <clipPath id="botClip"><polygon points="16,208 124,208 70,114"/></clipPath>
      </defs>

      <!-- glass panels -->
      <polygon points="16,18 124,18 70,110"  fill="rgba(90,174,212,0.10)"/>
      <polygon points="16,208 124,208 70,114" fill="rgba(90,174,212,0.10)"/>

      <!-- top sand -->
      <g clip-path="url(#topClip)">
        <rect id="sandTop" x="10" y="18" width="120" height="92" fill="#5aaed4"/>
      </g>
      <!-- bottom sand -->
      <g clip-path="url(#botClip)">
        <rect id="sandBot" x="10" y="208" width="120" height="0" fill="#5aaed4"/>
      </g>

      <!-- falling stream -->
      <line id="stream" x1="70" y1="113" x2="70" y2="130"
            stroke="#5aaed4" stroke-width="1.8" stroke-linecap="round"/>

      <!-- frame lines -->
      <line x1="16"  y1="18"  x2="70" y2="110" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="124" y1="18"  x2="70" y2="110" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="16"  y1="208" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="124" y1="208" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>

      <!-- caps -->
      <rect x="8" y="5"   width="124" height="18" rx="5" fill="#5aaed4"/>
      <rect x="8" y="192" width="124" height="18" rx="5" fill="#5aaed4"/>
      <circle cx="26"  cy="14"  r="3" fill="#c8e8f8" opacity="0.7"/>
      <circle cx="114" cy="14"  r="3" fill="#c8e8f8" opacity="0.7"/>
      <circle cx="26"  cy="201" r="3" fill="#c8e8f8" opacity="0.7"/>
      <circle cx="114" cy="201" r="3" fill="#c8e8f8" opacity="0.7"/>
    </svg>
  </div>

  <div class="flip-hint">click to flip &amp; start</div>
  <div class="time-display" id="timeDisp">20:00</div>
  <div class="status" id="statusTxt">ready</div>
  <div class="done-banner" id="doneBanner">session complete — flip to go again</div>

  <div class="btn-row">
    <button class="ctrl primary" id="startBtn" onclick="toggleStart()">Start</button>
    <button class="ctrl" onclick="resetClock()">Reset</button>
  </div>

  <div class="divider"></div>

  <div class="stats-section">
    <div class="stats-label">Today</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="flipCount">0</div>
        <div class="stat-lbl">flips</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="focusMin">0</div>
        <div class="stat-lbl">focus min</div>
      </div>
    </div>
  </div>
</div>

<!-- MINI WIDGET -->
<div class="mini-view" id="miniView" onclick="toggleMini()">
  <svg viewBox="0 0 140 220" preserveAspectRatio="xMidYMid meet">
    <defs>
      <clipPath id="mtC"><polygon points="16,18 124,18 70,110"/></clipPath>
      <clipPath id="mbC"><polygon points="16,208 124,208 70,114"/></clipPath>
    </defs>
    <polygon points="16,18 124,18 70,110"  fill="rgba(90,174,212,0.10)"/>
    <polygon points="16,208 124,208 70,114" fill="rgba(90,174,212,0.10)"/>
    <g clip-path="url(#mtC)"><rect id="miniSandTop" x="10" y="18" width="120" height="92" fill="#5aaed4"/></g>
    <g clip-path="url(#mbC)"><rect id="miniSandBot" x="10" y="208" width="120" height="0"  fill="#5aaed4"/></g>
    <line x1="16"  y1="18"  x2="70" y2="110" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="124" y1="18"  x2="70" y2="110" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="16"  y1="208" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="124" y1="208" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="8" y="5"   width="124" height="18" rx="5" fill="#5aaed4"/>
    <rect x="8" y="192" width="124" height="18" rx="5" fill="#5aaed4"/>
  </svg>
  <div class="mini-time-lbl" id="miniTimeLbl">20:00</div>
  <div class="mini-run-dot" id="miniRunDot"></div>
</div>

<script>
const { ipcRenderer } = require('electron')

function closeApp()    { ipcRenderer.send('close-app') }
function toggleMini()  { ipcRenderer.send('toggle-mini') }

ipcRenderer.on('mini-state', (_, isMini) => {
  document.body.classList.toggle('is-mini', isMini)
})

const DURATION = 20 * 60
let remaining = DURATION
let running   = false
let interval  = null
let secondsThisMinute = 0

function getTodayKey() {
  return 'sandclock_' + new Date().toISOString().slice(0, 10)
}
function loadStats() {
  try {
    const raw = localStorage.getItem(getTodayKey())
    if (raw) return JSON.parse(raw)
  } catch(e) {}
  return { flips: 0, focusMin: 0 }
}
function saveStats(s) {
  try { localStorage.setItem(getTodayKey(), JSON.stringify(s)) } catch(e) {}
}

let stats = loadStats()
document.getElementById('flipCount').textContent = stats.flips
document.getElementById('focusMin').textContent  = stats.focusMin

function fmt(s) {
  const m = Math.floor(s / 60), sec = s % 60
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0')
}

function updateSand() {
  const pct  = remaining / DURATION
  const topH = Math.round(pct * 92)
  const botH = 92 - topH

  // full view
  document.getElementById('sandTop').setAttribute('y', 18 + (92 - topH))
  document.getElementById('sandTop').setAttribute('height', topH)
  document.getElementById('sandBot').setAttribute('y', 208 - botH)
  document.getElementById('sandBot').setAttribute('height', botH)

  // mini view
  document.getElementById('miniSandTop').setAttribute('y', 18 + (92 - topH))
  document.getElementById('miniSandTop').setAttribute('height', topH)
  document.getElementById('miniSandBot').setAttribute('y', 208 - botH)
  document.getElementById('miniSandBot').setAttribute('height', botH)

  const showStream = running && remaining > 0
  document.getElementById('stream').style.display = showStream ? 'block' : 'none'
  document.getElementById('miniRunDot').style.display = (running && remaining > 0) ? 'block' : 'none'
}

function addSecondToStats() {
  secondsThisMinute++
  if (secondsThisMinute >= 60) {
    secondsThisMinute = 0
    stats.focusMin++
    saveStats(stats)
    document.getElementById('focusMin').textContent = stats.focusMin
  }
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval); interval = null; running = false
    document.getElementById('startBtn').textContent = 'Start'
    document.getElementById('statusTxt').textContent = 'done!'
    document.getElementById('doneBanner').style.display = 'block'
    document.getElementById('miniTimeLbl').textContent = '00:00'
    updateSand()
    return
  }
  remaining--
  addSecondToStats()
  const t = fmt(remaining)
  document.getElementById('timeDisp').textContent = t
  document.getElementById('miniTimeLbl').textContent = t
  document.getElementById('statusTxt').textContent = 'focusing…'
  updateSand()
}

function toggleStart() {
  if (running) {
    clearInterval(interval); interval = null; running = false
    document.getElementById('startBtn').textContent = 'Start'
    document.getElementById('statusTxt').textContent = 'paused'
  } else {
    if (remaining <= 0) { remaining = DURATION; updateSand() }
    document.getElementById('doneBanner').style.display = 'none'
    running = true
    document.getElementById('startBtn').textContent = 'Pause'
    document.getElementById('statusTxt').textContent = 'focusing…'
    interval = setInterval(tick, 1000)
  }
  updateSand()
}

function resetClock() {
  clearInterval(interval); interval = null; running = false
  remaining = DURATION
  secondsThisMinute = 0
  const t = fmt(remaining)
  document.getElementById('timeDisp').textContent = t
  document.getElementById('miniTimeLbl').textContent = t
  document.getElementById('startBtn').textContent = 'Start'
  document.getElementById('statusTxt').textContent = 'ready'
  document.getElementById('doneBanner').style.display = 'none'
  updateSand()
}

function flipClock() {
  const wrap = document.getElementById('hgWrap')
  wrap.classList.add('flipping')
  setTimeout(() => wrap.classList.remove('flipping'), 460)

  clearInterval(interval); interval = null; running = false
  remaining = DURATION
  secondsThisMinute = 0
  document.getElementById('doneBanner').style.display = 'none'

  stats.flips++
  saveStats(stats)
  document.getElementById('flipCount').textContent = stats.flips

  const t = fmt(remaining)
  document.getElementById('timeDisp').textContent = t
  document.getElementById('miniTimeLbl').textContent = t
  updateSand()

  running = true
  document.getElementById('startBtn').textContent = 'Pause'
  document.getElementById('statusTxt').textContent = 'focusing…'
  interval = setInterval(tick, 1000)
}

updateSand()
</script>
</body>
</html>
