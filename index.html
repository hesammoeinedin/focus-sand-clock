<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sand Clock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    .widget {
      width: 100vw;
      height: 100vh;
      background: rgba(220, 240, 255, 0.55);
      border-radius: 18px;
      border: 1.5px solid rgba(74,156,196,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 14px;
      gap: 0;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .close-btn {
      position: absolute;
      top: 10px; right: 10px;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #ff8a80;
      border: none;
      cursor: pointer;
      z-index: 10;
      -webkit-app-region: no-drag;
    }
    .close-btn:hover { background: #ff5252; }

    .hg-wrap {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      -webkit-app-region: no-drag;
    }
    .hg-wrap:active { transform: scale(0.97); }

    .flip-hint { font-size: 10px; color: #5a9ec9; margin-top: 4px; margin-bottom: 4px; flex-shrink: 0; }

    .time-display {
      font-size: 28px;
      font-weight: 300;
      color: #1a4a72;
      letter-spacing: 2px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .status {
      font-size: 12px;
      color: #5a9ec9;
      min-height: 16px;
      flex-shrink: 0;
    }

    .done-banner {
      font-size: 11px;
      color: #2e7d4f;
      background: rgba(46,125,79,0.1);
      border: 1px solid rgba(46,125,79,0.25);
      border-radius: 8px;
      padding: 4px 12px;
      display: none;
      text-align: center;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    button.ctrl {
      border: 1px solid rgba(42,96,150,0.3);
      background: rgba(255,255,255,0.4);
      color: #2a6096;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }
    button.ctrl:hover { background: rgba(255,255,255,0.65); }
    button.ctrl.primary { background: rgba(42,96,150,0.15); color: #1a4a72; }
    button.ctrl.primary:hover { background: rgba(42,96,150,0.28); }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(42,96,150,0.12);
      margin: 8px 0;
      flex-shrink: 0;
    }

    .stats-section { width: 100%; flex-shrink: 0; }

    .stats-label {
      font-size: 9px;
      color: #6aaddb;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-card {
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(42,96,150,0.15);
      border-radius: 10px;
      padding: 7px 10px;
      text-align: center;
    }

    .stat-val { font-size: 20px; font-weight: 400; color: #1a4a72; }
    .stat-lbl { font-size: 10px; color: #6aaddb; margin-top: 2px; }

    @keyframes shake {
      0%,100% { transform: rotate(0deg); }
      20%      { transform: rotate(-10deg); }
      40%      { transform: rotate(10deg); }
      60%      { transform: rotate(-6deg); }
      80%      { transform: rotate(6deg); }
    }
    .flipping { animation: shake 0.45s ease; }
    @keyframes drip { 0%,100%{opacity:0.6} 50%{opacity:1} }
  </style>
</head>
<body>
<div class="widget">

  <button class="close-btn" onclick="closeApp()" title="Close"></button>

  <div class="hg-wrap" id="hgWrap" title="Click to flip" onclick="flipClock()">
    <svg viewBox="0 0 140 228" style="width:100%; max-width:160px; height:auto;">
      <defs>
        <!-- Both triangles meet exactly at y=114 (the midpoint) -->
        <!-- Top triangle: from y=18 (top cap bottom) down to y=114 (midpoint) = 96px tall -->
        <!-- Bot triangle: from y=210 (bot cap top) up to y=114 (midpoint) = 96px tall -->
        <clipPath id="topClip"><polygon points="14,18 126,18 70,114"/></clipPath>
        <clipPath id="botClip"><polygon points="14,210 126,210 70,114"/></clipPath>
      </defs>

      <!-- glass panels -->
      <polygon points="14,18 126,18 70,114"  fill="rgba(180,220,245,0.18)"/>
      <polygon points="14,210 126,210 70,114" fill="rgba(180,220,245,0.18)"/>

      <!-- top sand: starts full (height=96), drains down by moving y down -->
      <g clip-path="url(#topClip)">
        <rect id="sandTop" x="8" y="18" width="124" height="96" fill="#7ec8e3" opacity="0.85"/>
      </g>
      <!-- bottom sand: starts empty (height=0), fills up by moving y up -->
      <g clip-path="url(#botClip)">
        <rect id="sandBot" x="8" y="210" width="124" height="0" fill="#5aaed4" opacity="0.85"/>
      </g>

      <!-- falling stream -->
      <g id="stream" style="display:none; animation: drip 0.8s ease-in-out infinite;">
        <rect x="68.5" y="115" width="3" height="14" rx="1.5" fill="#7ec8e3" opacity="0.9"/>
      </g>

      <!-- frame lines -->
      <line x1="14"  y1="18"  x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="126" y1="18"  x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="14"  y1="210" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="126" y1="210" x2="70" y2="114" stroke="#4a9cc4" stroke-width="2.2" stroke-linecap="round"/>

      <!-- caps -->
      <rect x="6" y="5"   width="128" height="18" rx="5" fill="#5aaed4"/>
      <rect x="6" y="210" width="128" height="18" rx="5" fill="#5aaed4"/>
      <circle cx="24"  cy="14"  r="3" fill="#c8e8f8" opacity="0.8"/>
      <circle cx="116" cy="14"  r="3" fill="#c8e8f8" opacity="0.8"/>
      <circle cx="24"  cy="219" r="3" fill="#c8e8f8" opacity="0.8"/>
      <circle cx="116" cy="219" r="3" fill="#c8e8f8" opacity="0.8"/>
    </svg>
  </div>

  <div class="flip-hint">click to flip &amp; start</div>
  <div class="time-display" id="timeDisp">20:00</div>
  <div class="status" id="statusTxt">ready</div>
  <div class="done-banner" id="doneBanner">session complete — flip to go again</div>

  <div class="btn-row">
    <button class="ctrl primary" id="startBtn" onclick="toggleStart()">Start</button>
    <button class="ctrl" onclick="resetClock()">Reset</button>
  </div>

  <div class="divider"></div>

  <div class="stats-section">
    <div class="stats-label">Today</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="flipCount">0</div>
        <div class="stat-lbl">flips</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="focusMin">0</div>
        <div class="stat-lbl">focus min</div>
      </div>
    </div>
  </div>

</div>

<script>
const { ipcRenderer } = require('electron')
function closeApp() { ipcRenderer.send('close-app') }

const DURATION = 20 * 60
let remaining = DURATION
let running   = false
let interval  = null
let secondsThisMinute = 0

function getTodayKey() {
  return 'sandclock_' + new Date().toISOString().slice(0, 10)
}
function loadStats() {
  try {
    const raw = localStorage.getItem(getTodayKey())
    if (raw) return JSON.parse(raw)
  } catch(e) {}
  return { flips: 0, focusMin: 0 }
}
function saveStats(s) {
  try { localStorage.setItem(getTodayKey(), JSON.stringify(s)) } catch(e) {}
}

let stats = loadStats()
document.getElementById('flipCount').textContent = stats.flips
document.getElementById('focusMin').textContent  = stats.focusMin

function fmt(s) {
  const m = Math.floor(s / 60), sec = s % 60
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0')
}

function updateSand() {
  const pct  = remaining / DURATION
  const topH = Math.round(pct * 96)   // top chamber is 96px tall
  const botH = 96 - topH              // bottom gets exactly what top loses
  document.getElementById('sandTop').setAttribute('y', 18 + (96 - topH))
  document.getElementById('sandTop').setAttribute('height', topH)
  document.getElementById('sandBot').setAttribute('y', 210 - botH)
  document.getElementById('sandBot').setAttribute('height', botH)
  document.getElementById('stream').style.display = (running && remaining > 0) ? 'block' : 'none'
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval); interval = null; running = false
    document.getElementById('startBtn').textContent = 'Start'
    document.getElementById('statusTxt').textContent = 'done!'
    document.getElementById('doneBanner').style.display = 'block'
    updateSand()
    return
  }
  remaining--
  secondsThisMinute++
  if (secondsThisMinute >= 60) {
    secondsThisMinute = 0
    stats.focusMin++
    saveStats(stats)
    document.getElementById('focusMin').textContent = stats.focusMin
  }
  document.getElementById('timeDisp').textContent = fmt(remaining)
  document.getElementById('statusTxt').textContent = 'focusing…'
  updateSand()
}

function toggleStart() {
  if (running) {
    clearInterval(interval); interval = null; running = false
    document.getElementById('startBtn').textContent = 'Start'
    document.getElementById('statusTxt').textContent = 'paused'
  } else {
    if (remaining <= 0) { remaining = DURATION; updateSand() }
    document.getElementById('doneBanner').style.display = 'none'
    running = true
    document.getElementById('startBtn').textContent = 'Pause'
    document.getElementById('statusTxt').textContent = 'focusing…'
    interval = setInterval(tick, 1000)
  }
}

function resetClock() {
  clearInterval(interval); interval = null; running = false
  remaining = DURATION
  secondsThisMinute = 0
  document.getElementById('timeDisp').textContent = fmt(remaining)
  document.getElementById('startBtn').textContent = 'Start'
  document.getElementById('statusTxt').textContent = 'ready'
  document.getElementById('doneBanner').style.display = 'none'
  updateSand()
}

function flipClock() {
  const wrap = document.getElementById('hgWrap')
  wrap.classList.add('flipping')
  setTimeout(() => wrap.classList.remove('flipping'), 460)

  clearInterval(interval); interval = null; running = false
  remaining = DURATION
  secondsThisMinute = 0
  document.getElementById('doneBanner').style.display = 'none'

  stats.flips++
  saveStats(stats)
  document.getElementById('flipCount').textContent = stats.flips

  document.getElementById('timeDisp').textContent = fmt(remaining)
  updateSand()

  running = true
  document.getElementById('startBtn').textContent = 'Pause'
  document.getElementById('statusTxt').textContent = 'focusing…'
  interval = setInterval(tick, 1000)
}

updateSand()
</script>
</body>
</html>
